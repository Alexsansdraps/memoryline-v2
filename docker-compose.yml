services:
  db:
    image: postgres:16-alpine
    container_name: memoryline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryline
      POSTGRES_PASSWORD: memoryline
      POSTGRES_DB: memoryline
    ports:
      # Attachée à cette machine SEULEMENT. Publiée sur toutes les interfaces,
      # avec les identifiants écrits juste au-dessus dans un fichier versionné,
      # la base réelle s'ouvrait à quiconque atteint le poste sur le réseau.
      - "127.0.0.1:5433:5432"
    volumes:
      - memoryline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryline -d memoryline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    # Un nom d'image PROPRE au développement. Sans lui, l'image s'appelle
    # memoryline-v2-<service>, exactement comme celle que fabrique
    # docker-compose.prod.yml construit sur ce poste : l'une écrasait l'autre, et
    # le site de test démarrait sur l'image de production (sans .env, sans
    # rechargement, ou en cherchant un site « construit » qui n'existe pas ici).
    image: memoryline-dev-api
    container_name: memoryline-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # La commande est écrite ici, et non laissée à l'image : l'image de
    # production porte le même nom (memoryline-v2-api) quand on la construit
    # sur ce poste, et la remplace. Le conteneur de développement démarrait
    # alors en mode production, sans lire .env — sans adresse publique, donc
    # des courriers sans logo, et sans rechargement automatique.
    command: ["pnpm", "--filter", "@memoryline/api", "run", "dev"]
    environment:
      # L'adresse du site écrite dans les courriers (logo, vignettes, liens).
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Base de données : par défaut le Postgres local (service "db" du réseau
      # Docker). Définir DATABASE_URL dans .env bascule sur une base hébergée
      # ailleurs — la stack n'a alors plus besoin du conteneur db.
      DATABASE_URL: "${DATABASE_URL:-postgres://memoryline:memoryline@db:5432/memoryline}"
      API_PORT: "3000"
      IMPORT_DIR: "/app/data/exports/shopify-2026-06-19"
      # Origines autorisées par CORS. Avec le proxy tout est en même origine,
      # mais on garde l'accès direct aux ports en développement.
      WEB_ORIGINS: "http://localhost:8080,http://localhost:4321,http://localhost:4322,${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Évite le purge interactif des node_modules par pnpm au démarrage.
      CI: "true"
      # Boîte aux lettres de test : renseignée, elle prend TOUS les courriers
      # à la place de Resend. Vide (ou service arrêté), on repasse par Resend.
      MAIL_TEST_URL: "${MAIL_TEST_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_BCC: "${MAIL_BCC:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # Où l'on demande les étiquettes. En développement : le faux serveur du
      # dépôt (profil « essais »), JAMAIS le vrai SendCloud — en v3 il n'y a ni
      # brouillon ni bac à sable, /shipments/announce achète pour de bon. Le
      # défaut est posé ici, et non dans .env, pour qu'il soit versionné et
      # qu'aucun poste ne se retrouve à appeler le vrai service par simple
      # oubli d'une ligne. Aucune clé ne passe par cette variable : elles sont
      # dans data/prive/secrets/, posées par Alexandra depuis le back-office.
      SENDCLOUD_BASE_URL: "${SENDCLOUD_BASE_URL:-http://faux-sendcloud:3100/api/v3}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Code source monté pour le hot-reload (tsx watch).
      - .:/app
      # node_modules installés dans l'image : on les préserve via des volumes
      # anonymes, sinon le bind-mount ci-dessus les masquerait.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # Nom d'image propre au développement : voir le service api.
    image: memoryline-dev-web
    container_name: memoryline-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # SSR / build : on parle à l'API via le réseau interne Docker.
      API_URL_INTERNAL: "http://api:3000"
      # Navigateur : même origine que le site, le proxy route /api vers l'API.
      # Vaut donc aussi bien en local (:8080) que derrière le tunnel.
      PUBLIC_API_URL: "/api"
      # Pré-remplit la page commande avec un client tiré au sort. Absent en
      # production : c'est ce qui garantit qu'aucun vrai client ne le verra.
      PUBLIC_JEU_ESSAI: "1"
      # Origine publique de l'environnement de test (canonical, Open Graph).
      SITE_URL: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Hôtes publics acceptés par le serveur de dev Astro (cf. astro.config).
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      # Environnement de test : JAMAIS indexé (doublon de memoryline.fr).
      PUBLIC_NOINDEX: "true"
      # Évite que pnpm/Astro tentent un purge interactif des node_modules.
      CI: "true"
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/types/node_modules
      - /app/packages/configurator/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    # Nom d'image propre au développement : voir le service api.
    image: memoryline-dev-admin
    container_name: memoryline-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL_INTERNAL: "http://api:3000"
      # Navigateur : même origine, le proxy route /api vers l'API.
      PUBLIC_API_URL: "/api"
      # Le BO est servi sous /bo (routage par chemin, cf. Caddyfile).
      ADMIN_BASE: "/bo"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CI: "true"
    ports:
      - "127.0.0.1:4322:4322"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/types/node_modules

  # Point d'entrée UNIQUE : un seul hôte, routage par chemin (cf. Caddyfile).
  # C'est ce service, et lui seul, que le tunnel Cloudflare expose.
  proxy:
    image: caddy:2-alpine
    container_name: memoryline-proxy
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  # Boîte aux lettres de TEST. Elle accepte tous les courriers de la boutique
  # et n'en livre aucun : ils s'affichent dans une page web, sur
  # http://localhost:8025. C'est ce qui permet de relire une confirmation de
  # commande sans écrire à un vrai client. Rien de tout cela ne sort de la
  # machine, et le service ne tourne qu'à la demande :
  #   docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:latest
    container_name: memoryline-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    environment:
      # Les messages restent en mémoire : ils disparaissent au redémarrage,
      # ce qui est exactement ce qu'on veut d'une boîte d'essai.
      MP_MAX_MESSAGES: "500"
    ports:
      - "8025:8025"

  # Un FAUX SendCloud, pour éprouver l'achat d'étiquettes transporteur sans
  # dépenser un centime. Chez SendCloud il n'y a pas de bac à sable, et l'API
  # v3 n'a aucun brouillon : « announce » ACHÈTE. Ce service répond à sa place,
  # sur cette machine, et sait en plus tomber en panne sur commande — délai
  # dépassé, refus, clés refusées — trois cas qu'on ne peut pas provoquer chez
  # un vrai transporteur.
  #
  # Il ne démarre QU'À LA DEMANDE, comme mailpit : un faux transporteur qui
  # tournerait en permanence finirait par servir sans qu'on s'en aperçoive.
  #   docker compose --profile essais up -d faux-sendcloud
  # puis, dans le .env de la racine (que l'API lit en développement) :
  #   SENDCLOUD_BASE_URL=http://faux-sendcloud:3100/api/v3
  #
  # Il ne lit lui-même AUCUN .env et ne connaît aucune clé : c'est la garantie
  # la plus simple qu'un banc d'essai n'en laisse pas fuir une.
  faux-sendcloud:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    # Son propre nom d'image : bâtie sur le même Dockerfile que l'API, elle en
    # réutilise toutes les couches sans écraser aucune autre étiquette.
    image: memoryline-dev-faux-sendcloud
    container_name: memoryline-faux-sendcloud
    restart: unless-stopped
    profiles: ["essais"]
    # Lancé par tsx DIRECTEMENT, et non par `pnpm run` comme les autres
    # services : pnpm vérifie les dépendances avant d'exécuter un script et
    # réinstalle tout le workspace au démarrage. Cette installation-là écrirait
    # des node_modules Linux dans les dossiers du poste d'Alexandra (Windows),
    # pour un serveur d'essai qui n'a besoin que de ce que l'image contient
    # déjà. Le script `faux-sendcloud` du package.json reste, lui, la façon de
    # le lancer à la main.
    working_dir: /app/apps/api
    command: ["npx", "tsx", "watch", "scripts/faux-sendcloud.ts"]
    environment:
      FAUX_SENDCLOUD_PORT: "3100"
      # Aucune question posée au démarrage : si jamais tsx manquait, npx
      # échouerait franchement au lieu d'attendre un « o/n » que personne ne
      # verra jamais dans un conteneur.
      CI: "true"
    ports:
      # Attaché à cette machine SEULEMENT, comme la base : un serveur qui
      # fabrique de fausses étiquettes n'a rien à faire sur le réseau.
      - "127.0.0.1:3100:3100"
    volumes:
      # Même montage que l'API : le script vit dans apps/api/scripts, et
      # `tsx watch` le recharge dès qu'on l'améliore.
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules

volumes:
  memoryline_pgdata:
