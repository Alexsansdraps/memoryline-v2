services:
  db:
    image: postgres:16-alpine
    container_name: memoryline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryline
      POSTGRES_PASSWORD: memoryline
      POSTGRES_DB: memoryline
    ports:
      - "5433:5432"
    volumes:
      - memoryline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryline -d memoryline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: memoryline-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Base de données : par défaut le Postgres local (service "db" du réseau
      # Docker). Définir DATABASE_URL dans .env bascule sur une base hébergée
      # ailleurs — la stack n'a alors plus besoin du conteneur db.
      DATABASE_URL: "${DATABASE_URL:-postgres://memoryline:memoryline@db:5432/memoryline}"
      API_PORT: "3000"
      IMPORT_DIR: "/app/data/exports/shopify-2026-06-19"
      # Origines autorisées par CORS. Avec le proxy tout est en même origine,
      # mais on garde l'accès direct aux ports en développement.
      WEB_ORIGINS: "http://localhost:8080,http://localhost:4321,http://localhost:4322,${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Évite le purge interactif des node_modules par pnpm au démarrage.
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      # Code source monté pour le hot-reload (tsx watch).
      - .:/app
      # node_modules installés dans l'image : on les préserve via des volumes
      # anonymes, sinon le bind-mount ci-dessus les masquerait.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: memoryline-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # SSR / build : on parle à l'API via le réseau interne Docker.
      API_URL_INTERNAL: "http://api:3000"
      # Navigateur : même origine que le site, le proxy route /api vers l'API.
      # Vaut donc aussi bien en local (:8080) que derrière le tunnel.
      PUBLIC_API_URL: "/api"
      # Origine publique de l'environnement de test (canonical, Open Graph).
      SITE_URL: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Hôtes publics acceptés par le serveur de dev Astro (cf. astro.config).
      ALLOWED_HOSTS: "${NGROK_DOMAIN:-}"
      # Environnement de test : JAMAIS indexé (doublon de memoryline.fr).
      PUBLIC_NOINDEX: "true"
      # Évite que pnpm/Astro tentent un purge interactif des node_modules.
      CI: "true"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/types/node_modules
      - /app/packages/configurator/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    container_name: memoryline-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL_INTERNAL: "http://api:3000"
      # Navigateur : même origine, le proxy route /api vers l'API.
      PUBLIC_API_URL: "/api"
      # Le BO est servi sous /bo (routage par chemin, cf. Caddyfile).
      ADMIN_BASE: "/bo"
      ALLOWED_HOSTS: "${NGROK_DOMAIN:-}"
      CI: "true"
    ports:
      - "4322:4322"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/types/node_modules

  # Point d'entrée UNIQUE : un seul hôte, routage par chemin (cf. Caddyfile).
  # C'est ce service, et lui seul, que le tunnel Cloudflare expose.
  proxy:
    image: caddy:2-alpine
    container_name: memoryline-proxy
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  # Tunnel ngrok : expose le proxy — et LUI SEUL — sur un domaine public, en
  # HTTPS. Aucun port n'est ouvert sur la box : ngrok sort en connexion
  # sortante. Ce qui est en ligne est donc EXACTEMENT ce qui tourne ici.
  #
  # Démarrage à la demande (profil), une fois .env renseigné :
  #   docker compose --profile tunnel up -d
  tunnel:
    image: ngrok/ngrok:latest
    container_name: memoryline-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - proxy
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    command: http proxy:80 --url=https://${NGROK_DOMAIN:-}

volumes:
  memoryline_pgdata:
