services:
  db:
    image: postgres:16-alpine
    container_name: memoryline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryline
      POSTGRES_PASSWORD: memoryline
      POSTGRES_DB: memoryline
    ports:
      - "5433:5432"
    volumes:
      - memoryline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryline -d memoryline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: memoryline-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connexion intra-réseau Docker : on parle au service "db" sur 5432.
      DATABASE_URL: "postgres://memoryline:memoryline@db:5432/memoryline"
      API_PORT: "3000"
      IMPORT_DIR: "/app/data/exports/shopify-2026-06-19"
      # Évite le purge interactif des node_modules par pnpm au démarrage.
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      # Code source monté pour le hot-reload (tsx watch).
      - .:/app
      # node_modules installés dans l'image : on les préserve via des volumes
      # anonymes, sinon le bind-mount ci-dessus les masquerait.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: memoryline-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # SSR côté serveur : on parle à l'API via le réseau interne Docker.
      API_URL_INTERNAL: "http://api:3000"
      # Évite que pnpm/Astro tentent un purge interactif des node_modules.
      CI: "true"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/types/node_modules
      - /app/packages/configurator/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    container_name: memoryline-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL_INTERNAL: "http://api:3000"
      CI: "true"
    ports:
      - "4322:4322"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/types/node_modules

volumes:
  memoryline_pgdata:
