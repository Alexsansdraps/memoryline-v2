<title>Memory Line — de retour dans un instant</title>
<style>
  :root { --rouge: #9c1616; --encre: #121212; --doux: rgba(18, 18, 18, 0.7); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #ffffff;
    color: var(--encre);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 460px; }
  img { width: 180px; height: auto; margin: 0 auto 28px; display: block; }
  h1 { font-size: 26px; font-weight: 500; margin: 0 0 12px; letter-spacing: -0.01em; }
  p { font-size: 16px; line-height: 1.6; color: var(--doux); margin: 0 0 8px; }
  .en { margin-top: 24px; font-size: 14px; }
  .points { display: inline-flex; gap: 6px; margin: 22px 0 0; }
  .points span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--rouge); opacity: 0.25;
  }
  @media (prefers-reduced-motion: no-preference) {
    .points span { animation: battre 1.2s ease-in-out infinite; }
    .points span:nth-child(2) { animation-delay: 0.2s; }
    .points span:nth-child(3) { animation-delay: 0.4s; }
  }
  @keyframes battre { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
